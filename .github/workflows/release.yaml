# Code generated by protoc-gen-sdk 0.2.2. DO NOT EDIT.
name: Release

# On a version tag, or after a Dependabot update of the dependencies merged
# and green on main (released as the next patch version): test, set the
# workspace's version to the tag's, package every crate, attest their SLSA
# build provenance and an SPDX SBOM (GitHub artifact attestations,
# Sigstore), publish the release notes -- the tag's CHANGELOG.md section, or
# the updates' commits -- as the GitHub release, and publish the crates to
# crates.io (the GAPIC crates first) by trusted publishing (OIDC, no token).

on:
  push:
    tags: ['v*']
  # A Dependabot update of the dependencies, merged and green on main, is
  # released as the next patch version (the version job decides).
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_commit.author.name == 'dependabot[bot]')
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      auto: ${{ steps.version.outputs.auto }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - id: version
        name: Decide the version
        env:
          MANIFESTS: Cargo.toml
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "auto=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
          if [ -z "$last" ]; then
            echo "No release yet: the first one is tagged by hand."
            exit 0
          fi
          # shellcheck disable=SC2086
          if git diff --quiet "$last" HEAD -- $MANIFESTS; then
            echo "No dependency changed since $last: nothing to release."
            exit 0
          fi
          base="${last#v}"
          base="${base%%-*}"
          IFS=. read -r major minor patch <<< "$base"
          next="v$major.$minor.$((patch + 1))"
          git tag "$next" HEAD
          git push origin "$next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "auto=true" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write      # Sigstore, for the attestations
      attestations: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      AUTO: ${{ needs.version.outputs.auto }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Set the version
        run: |
          # Cargo.toml carries 0.0.0 for the workspace and its GAPIC crates;
          # the release is the tag's version.
          sed -i "s/\"0\.0\.0\"/\"${TAG#v}\"/g" Cargo.toml
      - name: Test
        run: cargo test --workspace
      - name: Package
        run: cargo package --workspace --allow-dirty --no-verify
      - name: Release notes
        run: |
          if [ "$AUTO" = true ]; then
            prev="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$TAG^" 2>/dev/null || true)"
            {
              echo "Dependency updates, released automatically:"
              echo
              git log --format='- %s' "${prev:+$prev..}$TAG"
            } > notes.md
            exit 0
          fi
          version="${TAG#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - name: SLSA build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: target/package/*.crate
      - name: SBOM attestation
        uses: actions/attest-sbom@v2
        with:
          subject-path: target/package/*.crate
          sbom-path: sbom.spdx.json
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md $prerelease \
            target/package/*.crate sbom.spdx.json

  publish:
    name: Publish to crates.io
    needs: [version, build]
    runs-on: ubuntu-latest
    # crates.io's trusted publisher for each crate names this workflow and
    # environment; no API token exists.
    environment:
      name: crates-io
      url: https://crates.io/crates/shokki-freebusy
    permissions:
      id-token: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Set the version
        run: sed -i "s/\"0\.0\.0\"/\"${TAG#v}\"/g" Cargo.toml
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --workspace --allow-dirty
