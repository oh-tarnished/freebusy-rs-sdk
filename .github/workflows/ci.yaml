# Code generated by protoc-gen-sdk 0.2.2. DO NOT EDIT.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy -p shokki-freebusy --all-targets -- -D warnings

  test:
    name: Test (Rust ${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.91"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc
        run: cargo doc -p shokki-freebusy --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo package
        run: cargo package --workspace --no-verify

  audit:
    name: Vulnerabilities (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # cargo-audit itself: the rustsec/audit-check action reports through a
      # check run, which needs a write permission pull requests (Dependabot's
      # included) do not get. Vulnerabilities fail the job; unmaintained
      # crates are warnings.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit

  osv:
    name: Dependencies (OSV-Scanner)
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.0
    with:
      scan-args: --recursive ./
      # Fails the job on a known vulnerability. The SARIF stays a run
      # artifact: uploading it to code scanning needs GitHub Advanced
      # Security, which a private repository may not have.
      upload-sarif: false

  sandbox:
    name: Examples against the API server (sandbox)
    runs-on: ubuntu-latest
    # The server is the release sandbox/compose.yaml pins; Dependabot opens
    # a pull request for each new one, and this job tests it.
    env:
      FREEBUSY_CALDAV_URL: "http://127.0.0.1:8080/dav"
      FREEBUSY_ENDPOINT: "127.0.0.1:50051"
      FREEBUSY_INSECURE: "true"
      FREEBUSY_REST_ENDPOINT: "http://127.0.0.1:8080"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start the sandbox
        run: docker compose -f sandbox/compose.yaml up -d
      - name: Wait until it is ready
        run: |
          for _ in $(seq 90); do
            curl -fsS "http://127.0.0.1:8080/health" >/dev/null && exit 0
            sleep 2
          done
          echo "::error::the sandbox never answered http://127.0.0.1:8080/health"
          exit 1
      - name: Run the examples
        run: |
          for f in examples/*.rs; do
            [ -f "$f" ] || continue
            echo "== $f"
            cargo run --quiet --example "$(basename "$f" .rs)"
          done
      - name: Sandbox logs
        if: failure()
        run: docker compose -f sandbox/compose.yaml logs --no-color
      - name: Tested against
        if: always()
        run: |
          {
            echo "### Sandbox"
            docker compose -f sandbox/compose.yaml config --images | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

