version: 2
# Daily, so a fixed vulnerability in a dependency arrives within a day.
# Updates come grouped; CI's checks gate them, dependabot-auto-merge.yaml
# merges them once they pass, and the release workflow then releases the
# next patch version when Cargo.toml's dependencies changed.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    groups:
      dependencies:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # The API server the sandbox runs: each release is a pull request, which
  # CI's sandbox job tests the examples against.
  - package-ecosystem: docker-compose
    directory: /sandbox
    schedule:
      interval: daily
    groups:
      sandbox:
        patterns: ["*"]

